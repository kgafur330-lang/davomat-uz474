services:
  - type: web
    name: davomat-uz474
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    healthCheckPath: /health
    disk:
      name: davomat-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DAVOMAT_DATA_DIR
        value: /var/data
      - key: FACEID_SECRET
        generateValue: true
      - key: INITIAL_ADMIN_USERNAME
        value: admin
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.11
